[package]
name = "pacyte-node"
version = "0.25.2"
edition = "2021"
authors = ["Pacyte Nexus Team"]
description = "Titan-Grade Layer 1 Blockchain - Production Ready"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bincode = "1.3"
ed25519-dalek = { version = "1.0", features = ["serde", "rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
rand = "0.7"
hex = "0.4"
blake3 = "1.5"
pqcrypto-dilithium = "0.4"
pqcrypto-traits = "0.3"
rocksdb = "0.21"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "5.5"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
anyhow = "1.0"
async-trait = "0.1"
ctrlc = "3.4"
num_cpus = "1.16"
uuid = { version = "1.6", features = ["v4"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "compression-br"] }
hyper = "1.0"
tokio-tungstenite = "0.21"
prometheus = { version = "0.13", features = ["process"] }
ripemd = "0.1"               # eklendi
wasmparser = "0.121"         # eklendi
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = "0.12"
rand_chacha = "0.3"
tower = { version = "0.4", features = ["timeout"] }
lru = "0.12"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[lib]
name = "pacyte_node"
path = "src/lib.rs"

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "network_test"
path = "tests/network_test.rs"

[[test]]
name = "consensus_test"
path = "tests/consensus_test.rs"